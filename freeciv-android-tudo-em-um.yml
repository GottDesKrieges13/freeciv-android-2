      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ferramentas do PC
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config python3 unzip curl \
            build-essential libicu-dev libcurl4-openssl-dev libsqlite3-dev zlib1g-dev \
            libbz2-dev liblzma-dev

      - name: NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "Usando NDK em $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Cache das dependências Android
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: android-prefix
          key: deps-v2-${{ hashFiles('scripts/build-native-deps.sh') }}

      - name: Compilar dependências (SDL2, ICU, curl, sqlite)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-deps.sh

      - name: Compilar o Freeciv
        run: bash scripts/build-freeciv.sh

      - name: Gerar o APK
        run: bash scripts/make-apk.sh

      - name: Enviar o APK
        uses: actions/upload-artifact@v4
        with:
          name: freeciv-debug-apk
          path: freeciv-debug.apk

      - name: Enviar logs (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-de-erro
          path: |
            build/android/meson-logs/
            build/host/meson-logs/
            deps-work/**/CMakeFiles/CMakeError.log
            deps-work/**/config.log
          if-no-files-found: ignore
